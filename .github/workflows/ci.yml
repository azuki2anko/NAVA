name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore RxV4A.Manager.sln

      - name: Build
        run: dotnet build RxV4A.Manager.sln -c Release --no-restore

      - name: Test
        run: dotnet test RxV4A.Manager.sln -c Release --no-build --no-restore

      - name: Verify formatting
        run: dotnet format RxV4A.Manager.sln --verify-no-changes --no-restore

      - name: Verify self-contained publish
        run: dotnet publish src/RxV4A.Desktop/RxV4A.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/publish
